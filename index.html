<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<title>Scheda pedana – spada</title>
<style>
:root{--bg:#fff;--fg:#111;--mut:#5b5b5b;--line:#e2e2e0;--card:#f4f4f2;
--cad:#1f6fd1;--gio:#e08a00;--ass:#8a3fb5;--u23:#8a8a8a;--win:#15803d;--loss:#c62828}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
padding:env(safe-area-inset-top) 0 calc(78px + env(safe-area-inset-bottom)) 0}
main{max-width:560px;margin:0 auto;padding:12px 14px}
.page{display:none}.page.on{display:block}
h1{font-size:34px;line-height:1.05;margin:2px 0 4px;letter-spacing:-.5px}
h1 span{font-weight:500}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:22px 0 8px}
.kick{font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--mut)}
.sub{color:var(--mut);font-size:16px}
.card{background:var(--card);border-radius:14px;padding:14px;margin:10px 0}
.big{font-size:44px;font-weight:800;line-height:1;letter-spacing:-1px}
.mid{font-size:24px;font-weight:700;line-height:1.1}
.mut{color:var(--mut)}.sm{font-size:15px}.xs{font-size:13px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.tag{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.05em;padding:3px 8px;border-radius:99px;white-space:nowrap}
.t-s{background:#111;color:#fff}.t-i{border:2px dashed #888;color:#444}
.chip{display:inline-block;font-size:13px;font-weight:800;padding:3px 9px;border-radius:8px;min-width:62px;text-align:center}
.l-forte{background:#111;color:#fff}.l-pari{background:#cfcfcb;color:#111}.l-debole{border:2px solid #aaa;color:#444;padding:1px 7px}
.btn{display:flex;align-items:center;justify-content:center;min-height:52px;padding:8px 14px;border-radius:12px;border:2px solid #111;
background:#fff;color:#111;font-weight:700;font-size:17px;line-height:1.1;font-family:inherit;width:100%;text-align:center}
.btn.on{background:#111;color:#fff}
.btn[disabled]{opacity:.35}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 4px}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.chips.c5{grid-template-columns:repeat(5,1fr)}
.chips .btn{min-height:48px;font-size:14px;padding:6px 4px;border-width:3px}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid #111;display:none;grid-template-columns:repeat(4,1fr);
padding-bottom:env(safe-area-inset-bottom);z-index:9}
nav.on{display:grid}
nav button{min-height:64px;border:0;background:#fff;font-weight:700;font-size:14px;line-height:1.1;font-family:inherit;color:#777;padding:6px 2px}
nav button.on{color:#fff;background:#111}
table{width:100%;border-collapse:collapse}
td,th{padding:9px 4px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
th{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.catbar{display:inline-block;width:6px;height:1.1em;border-radius:3px;margin-right:7px;vertical-align:-2px}
.pt{font-size:22px;font-weight:800}
.bul{margin:0;padding:0;list-style:none}
.bul li{padding:12px 0;border-bottom:1px solid var(--line)}
.bul li:last-child{border:0}
.bul p{margin:6px 0 0}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:#e4e4e1;margin-top:6px}
.bar i{display:block;height:100%}.bar .w{background:var(--win)}.bar .s{background:var(--loss)}
.grid3{display:grid;grid-template-columns:78px 1fr 1fr;gap:8px 10px;align-items:center}
.grid3 .hd{font-size:13px;color:var(--mut);font-weight:700;text-transform:uppercase}
.cellv{white-space:nowrap;font-size:22px;font-weight:800;line-height:1}
.bout{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:11px 0;border-bottom:1px solid var(--line)}
.bout .sc{font-size:26px;font-weight:800;text-align:right;line-height:1}
.bout .nm{font-weight:700}
.vs{font-weight:800}
.win{color:var(--win)}.loss{color:var(--loss)}
.badge-w{background:var(--win);color:#fff}.badge-l{background:var(--loss);color:#fff}
svg{width:100%;height:auto;display:block;touch-action:manipulation}
details{margin:10px 0}summary{min-height:48px;display:flex;align-items:center;font-weight:700;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:15px;margin:6px 0}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.arrow{font-weight:800}
/* ricerca atleti */
.fld{margin:16px 0 4px}
.fld label{display:block;font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--mut);text-transform:uppercase;margin-bottom:6px}
.fld input{width:100%;min-height:58px;font-weight:600;font-size:20px;line-height:1.1;font-family:inherit;padding:10px 14px;border:2px solid #111;border-radius:12px;background:#fff;color:#111;outline:none}
.fld input:focus{box-shadow:0 0 0 3px #bbb}
.fld.ok input{border-color:var(--win);background:#f1faf4}
.sg{margin-top:6px}
.sg button{display:block;width:100%;text-align:left;min-height:56px;padding:8px 12px;border:0;border-bottom:1px solid var(--line);background:#fff;font-family:inherit;color:#111}
.sg button b{display:block;font-size:19px}
.sg button span{font-size:14px;color:var(--mut)}
.sg.list{border:2px solid #111;border-radius:12px;overflow:hidden}
.sg.list button:last-child{border-bottom:0}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quick button{border:2px solid #111;border-radius:12px;border-bottom:2px solid #111;min-height:52px;text-align:center;padding:6px 8px;font-size:16px}
.quick button b{font-size:16px;display:inline}
.back{display:inline-flex;align-items:center;min-height:44px;padding:0 4px;margin:0 0 4px -4px;border:0;background:none;font-weight:700;font-size:16px;line-height:1;font-family:inherit;color:#444}
.note{font-size:14px;color:var(--mut);margin:10px 0}
</style>
</head>
<body>
<main>
<section id="setup" class="page on"></section>
<section id="p0" class="page"></section>
<section id="p1" class="page"></section>
<section id="p2" class="page"></section>
<section id="p3" class="page"></section>
</main>
<nav id="nav">
<button class="on" onclick="go(0)">Scheda</button>
<button onclick="go(1)">Andamento</button>
<button onclick="go(2)">Forti / Deboli</button>
<button id="navCon" onclick="go(3)">Con te</button>
</nav>

function trends(ra){

 CAT.forEach(c=>{

  const f=(x[0]+x[1])/2,l=(x[x.length-2]+x[x.length-1])/2,d=l-f;
  o[c]=d<-10?'su':d>10?'giu':'stabile';
 });

}

function suggest(q){
 const toks=noacc(q).replace(/[^A-Z0-9 ]/g,' ').split(/\s+/).filter(Boolean);
 if(!toks.length)return[];
 const out=[];
 for(let i=0;i<SRCH.length;i++){
  const s=SRCH[i];let ok=true,pre=0;
  for(const t of toks){const p=s.indexOf(t);if(p<0){ok=false;break}if(p===0||s[p-1]===' ')pre++}
  if(ok)out.push([i,pre===toks.length?0:1]);
 }
 out.sort((x,y)=>x[1]-y[1]||ACT[y[0]]-ACT[x[0]]);
 return out.slice(0,8).map(x=>x[0]);
}

 const op=profile(SEL.op),me=profile(SEL.me);
 const h2h=op.bouts.filter(b=>b.oppId===me.id);
 X={op,me,h2h};
 S.liv='reg';S.lvl='reg';S.cats={CADETTI:1,GIOVANI:1,ASSOLUTI:1,UNDER23:1};S.showB=1;S.sel=null;
 $('navCon').textContent='Con '+tc(me.cog.split(' ').slice(-1)[0]);
 $('setup').classList.remove('on');$('nav').classList.add('on');
 p0();p1();p2();p3();go(0);
}

/* ---------- PAGINA 0: SCHEDA ---------- */
function p0(){
 const{op,me,h2h}=X, ra=op.ra, rb=me.ra;
 const hw=h2h.filter(b=>b.w).length, hl=h2h.length-hw, last=h2h[0];
 const hg=h2h.filter(b=>b.tipo==='gir').length, hd=h2h.length-hg;
 let prec;
 if(!h2h.length){
  prec='<div class="row" style="margin-top:6px"><div class="big">0 – 0</div><div class="sm" style="text-align:right">nessun incontro<br>nei dati</div></div>'+
   '<p style="margin:10px 0 0">Non risultano assalti tra voi nei file regionali e nazionali.</p>';
 }else{
  const sc=(last.a==null||last.b==null)?'':' '+(last.w?last.a+'–'+last.b:last.b+'–'+last.a);
  const lastTxt=last.w?'ha vinto lui'+sc:'hai vinto tu'+sc;
  const kind=hd===0?'Tutti i precedenti sono gironi a 5 stoccate.':hg===0?'Tutti i precedenti sono dirette a 15 stoccate.':hg+(hg===1?' girone':' gironi')+' (5 stoccate) e '+hd+(hd===1?' diretta':' dirette')+' (15).';
  prec='<div class="row" style="margin-top:6px"><div class="big">'+hw+' – '+hl+'</div><div class="sm" style="text-align:right">lui '+hw+' · tu '+hl+'<br>'+tag(sol(h2h.length,6),h2h.length+(h2h.length===1?' assalto':' assalti'))+'</div></div>'+
   '<p style="margin:10px 0 10px"><b>Ultimo: '+fd(last.data)+'</b> ('+CATN[last.cat]+', '+(last.tipo==='gir'?'girone':'diretta '+turnoL(last.turno))+') — <b class="'+(last.w?'loss':'win')+'">'+lastTxt+'</b>. '+kind+'</p>'+
   '<button class="btn" onclick="go(3)">Vedi gli assalti</button>';
 }
 let rows='';
 ['CADETTI','GIOVANI','ASSOLUTI'].forEach(c=>{
  const a=lastOf(ra,'reg',c),b=lastOf(rb,'reg',c);
  if(!a&&!b)return;
  const cell=(r,t)=>r?'<div class="pt">'+r.pos+'°<span class="mut sm" style="font-weight:500">/'+r.n+'</span></div><div class="xs mut">Top '+r.top+'% · '+fd(r.data)+'</div><div class="xs">'+arrow(t)+'</div>':'<span class="mut">—</span>';
  rows+='<tr><td style="width:30%"><span class="catbar" style="background:'+COL[c]+'"></span><b>'+CATN[c]+'</b></td><td>'+cell(a,op.tr[c])+'</td><td>'+cell(b,me.tr[c])+'</td></tr>';
 });
 const na=lastOf(ra,'naz'),nb=lastOf(rb,'naz');
 const nrow=r=>r?'<div class="pt">'+r.pos+'°<span class="mut sm" style="font-weight:500">/'+r.n+'</span></div><div class="xs mut">'+esc(r.label)+' '+CATN[r.cat]+' · '+fd(r.data)+'</div>':'<span class="mut">—</span>';
 rows+='<tr><td><b>Nazionali</b><div class="xs mut">ultima</div></td><td>'+nrow(na)+'</td><td>'+nrow(nb)+'</td></tr>';

 /* punti da sapere */
 const reg=op.bouts.filter(b=>b.liv==='reg'), nzb=op.bouts.filter(b=>b.liv==='naz');
 const dn=reg.filter(b=>b.tipo==='dir'), gir=reg.filter(b=>b.tipo==='gir');
 const parts=(list,labs)=>labs.map(([lv,t])=>{const l=list.filter(b=>b.lv===lv);return l.length?t+' '+fmt(wl(l)):''}).filter(Boolean).join(', ');
 const bl=[];
 if(dn.length){
  const deepest=Math.min(...dn.map(b=>b.turno));
  const pp=parts(dn,[['debole','con i deboli'],['pari','con i pari'],['forte','con i forti']]);
  bl.push('<li>'+tag(sol(dn.length,12),dn.length+' assalti')+'<p><b>Dirette regionali (15 punti): '+fmt(wl(dn))+'.</b> Turno più avanzato giocato: '+turnoLong(deepest)+'.'+(pp?' '+pp.charAt(0).toUpperCase()+pp.slice(1)+'.':'')+'</p></li>');
 }
 if(gir.length){
  bl.push('<li>'+tag(sol(gir.length,15),gir.length+' assalti')+'<p><b>Gironi regionali (5 stoccate): '+fmt(wl(gir))+'.</b> '+parts(gir,[['forte','forti'],['pari','pari'],['debole','deboli']])+'.</p></li>');
 }
 if(nzb.length||na){
  const ng=nzb.filter(b=>b.tipo==='gir'),nd=nzb.filter(b=>b.tipo==='dir');
  const nev=new Set(ra.filter(r=>r.liv==='naz').map(r=>r.ev)).size;
  const old=na&&na.data<'2025-09-01';
  bl.push('<li>'+tag(nzb.length?sol(nzb.length,15):'i',nev+(nev===1?' gara':' gare'))+'<p><b>Nazionali'+(na?': ultima '+esc(na.label)+' '+CATN[na.cat]+' '+na.pos+'°/'+na.n+' ('+fd(na.data)+')':'')+'.</b>'+
   (nzb.length?' Gironi '+(ng.length?fmt(wl(ng)):'n.d.')+', dirette '+(nd.length?fmt(wl(nd)):'n.d.')+'.':' Nessun assalto nazionale nei dati.')+
   (old?' <span class="mut">Dato della stagione scorsa.</span>':'')+'</p></li>');
  const recent=na&&na.data>='2025-09-01';
  if(recent)bl.unshift(bl.pop());
 }
 const punti=bl.length?'<ul class="bul">'+bl.join('')+'</ul>':'<p class="sm mut" style="margin:10px 0">Nessun assalto registrato nei dati per questo atleta.</p>';

 /* categoria, salite e discese */
 const seas=[...new Set(ra.filter(r=>HI[r.cat]).map(r=>seasonOf(r.data)))].sort();
 const catsIn=s=>CAT.filter(c=>HI[c]&&ra.some(r=>r.cat===c&&seasonOf(r.data)===s));
 const hiIn=s=>Math.max(...catsIn(s).map(c=>HI[c]));
 let srows='';
 seas.forEach((s,i)=>{
  let mv='';
  if(i>0){const d=hiIn(s)-hiIn(seas[i-1]);mv=d>0?'<span class="arrow">▲</span> sale':d<0?'<span class="arrow">▼</span> scende':'<span class="arrow">►</span> stessa'}
  srows+='<tr><td style="width:27%"><b>'+sl(s)+'</b></td><td>'+catsIn(s).map(c=>'<span class="catbar" style="background:'+COL[c]+';height:.9em;margin-right:4px"></span>'+CATN[c]).join(' · ')+'</td><td class="sm" style="white-space:nowrap">'+mv+'</td></tr>';
 });
 const lastR=ra.slice(-1)[0];
 const all=ra.map(r=>r.data);
 let gap='';
 for(let i=1;i<all.length;i++){if(dayDiff(all[i-1],all[i])>=200){gap='Nessuna gara nei dati tra '+fd(all[i-1])+' e '+fd(all[i])+'.';}}
 if(lastR&&dayDiff(lastR.data,DATA_END)>=200)gap='Nessuna gara nei dati dopo il '+fd(lastR.data)+'.';
 const catCard=lastR?'<p style="margin:0"><b>Ultima gara: '+CATN[lastR.cat]+' ('+esc(lastR.label)+') '+fd(lastR.data)+'.</b></p>'+
  (seas.length?'<table style="margin-top:6px">'+srows+'</table><div class="xs mut" style="padding-top:6px">Categorie per stagione (regionali e nazionali, Under 23 escluse). ▲/▼ = categoria più alta rispetto alla stagione prima.</div>':'')+
  (gap?'<p class="sm" style="margin:8px 0 0">'+gap+'</p>':'')+
  '<p class="sm mut" style="margin:8px 0 0">'+tag('i','assenza nei dati ≠ cambio certo')+'</p>':'<p class="sm mut" style="margin:0">Nessuna classifica nei dati.</p>';

 /* dati mancanti */
 const miss=[];
 const recentN=ra.some(r=>r.liv==='naz'&&r.data>='2025-09-01');
 if(!recentN)miss.push('Nessuna gara nazionale 2025/26 per lui nei dati'+(na?'; l’ultima è del '+fd(na.data)+'.':'.'));
 if(!ra.some(r=>r.liv==='naz'))miss.push('Nessuna gara nazionale per lui nei dati: il quadro è solo regionale e per chi tira anche a livello nazionale è parziale.');
 if(!h2h.some(b=>b.tipo==='dir'))miss.push('Nessun precedente in diretta con te'+(h2h.length?': solo gironi a 5 stoccate.':'.'));
 if(lastR&&lastR.liv==='reg'&&!lastR.rank)miss.push('Senza ranking FIS nell’ultima gara regionale ('+fd(lastR.data)+').');
 if(!ra.length)miss.push('Atleta non presente in nessuna classifica dei file.');
 if(nzb.some(b=>b.tipo==='dir'&&b.a==null))miss.push('Alcune dirette nazionali senza punteggio (grafici dei PDF federali).');
 miss.push('Gironi nazionali 2025/26: classifica dopo i gironi sì, ma assalto per assalto no (PDF FIS). Le dirette dal turno dei 32 hanno nomi troncati: pochi assalti potrebbero non essere abbinati.');
 miss.push('Due gare Assoluti regionali (17/5/25 e 27/9/25) hanno solo le dirette: compaiono negli assalti ma senza livello forte/debole.');
 miss.push('“Forte/pari/debole” è calcolato sul seeding dopo i gironi di quella gara (oltre il 10% degli iscritti), non sul ranking.');
 miss.push('Atleti riconosciuti per nome: possibili omonimi o nomi scritti in modo diverso.');
 if(ra.some(r=>PROV.has(r.ev)))miss.push('Cadetti regionale dell’11/10/26: classifica finale ricostruita dalle dirette (4Fence non ancora pubblicata), quindi provvisoria.');
 miss.push('Dati aggiornati al '+DB.upd+'.');

 $('p0').innerHTML=backBtn+'<div class="kick">AVVERSARIO · SPADA</div><h1>'+esc(tc(op.cog))+' <span>'+esc(tc(op.nome))+'</span></h1>'+
 '<div class="sub">'+esc(socName(op.soc))+(op.yob?' · classe '+op.yob:'')+'</div>'+
 '<div class="card"><div class="kick">PRECEDENTI CON TE ('+esc(tc(me.cog).toUpperCase())+')</div>'+prec+'</div>'+
 '<h2>Dove sta in classifica</h2>'+
 '<div class="card" style="padding:6px 12px"><table><tr><th></th><th>Lui</th><th>Tu</th></tr>'+rows+'</table>'+
 '<div class="xs mut" style="padding:6px 0 4px">Regionali: ultima gara per categoria. Posizione finale / iscritti. Tendenza = prime 2 gare contro ultime 2 (servono almeno 3 gare).</div></div>'+
 '<h2>Da sapere prima dell’assalto</h2><div class="card" style="padding:4px 14px">'+punti+'</div>'+
 '<h2>Categoria</h2><div class="card">'+catCard+'</div>'+
 '<details class="card"><summary>Dati mancanti o parziali</summary><div class="sm">'+miss.map(m=>'<p>• '+esc(m)+'</p>').join('')+'</div></details>';
}

/* ---------- PAGINA 1: ANDAMENTO ---------- */
const MS=[[2024,9],[2024,12],[2025,3],[2025,6],[2025,9],[2025,12],[2026,3],[2026,6],[2026,9]];
const MN=['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];
const LIVN={reg:'Regionali',naz:'Nazionali'};
const h2hOf=ev=>X.h2h.filter(b=>b.ev===ev);
const scTxt=b=>(b.a==null||b.b==null)?'':' '+(b.w?b.a+'–'+b.b:b.b+'–'+b.a);
function chartSVG(liv){
 const A0=X.op.ra,B0=X.me.ra;
 const W=360,H=300,L=44,R=14,T=26,Bt=46,iw=W-L-R,ih=H-T-Bt;
 const t0=Date.UTC(2024,8,1),t1=Date.UTC(2026,9,31);
 const Xp=d=>{const[y,m,dd]=d.split('-').map(Number);return L+iw*(Date.UTC(y,m-1,dd)-t0)/(t1-t0)};
 const XT=(y,m)=>L+iw*(Date.UTC(y,m-1,1)-t0)/(t1-t0);
 const Y=p=>T+ih*p/100;
 let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Andamento posizione in classifica, '+LIVN[liv]+'">';
 [[2024,9,2025,9,'2024/25',0],[2025,9,2026,9,'2025/26',1],[2026,9,2026,11,'26/27',0]].forEach(b=>{
  const x1=Math.max(L,XT(b[0],b[1])),x2=Math.min(W-R,XT(b[2],b[3]));
  s+='<rect x="'+x1+'" y="'+T+'" width="'+(x2-x1)+'" height="'+ih+'" fill="'+(b[5]?'#f1f1ef':'#fff')+'"/>';
  s+='<text x="'+((x1+x2)/2)+'" y="'+(H-6)+'" font-size="12" font-weight="700" text-anchor="middle" fill="#555">'+b[4]+'</text>';
 });
 [[0,'1°'],[25,'25%'],[50,'50%'],[75,'75%'],[100,'ult.']].forEach(g=>{
  s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(g[0])+'" y2="'+Y(g[0])+'" stroke="#d4d4d0" stroke-width="'+(g[0]===50?1.6:1)+'" '+(g[0]===50?'':'stroke-dasharray="3 4"')+'/>';
  s+='<text x="'+(L-6)+'" y="'+(Y(g[0])+4)+'" font-size="12" text-anchor="end" fill="#444" font-weight="600">'+g[1]+'</text>';
 });
 MS.forEach(m=>{const x=XT(m[0],m[1]);
  s+='<line x1="'+x+'" x2="'+x+'" y1="'+(T+ih)+'" y2="'+(T+ih+5)+'" stroke="#888"/>';
  s+='<text x="'+x+'" y="'+(T+ih+17)+'" font-size="11" text-anchor="middle" fill="#444">'+MN[m[1]-1]+'</text>';
  s+='<text x="'+x+'" y="'+(T+ih+28)+'" font-size="10" text-anchor="middle" fill="#888">'+String(m[0]).slice(2)+'</text>';});
 const A=A0.map((r,i)=>({...r,i})).filter(r=>r.liv===liv);
 const Bq=B0.map((r,i)=>({...r,i})).filter(r=>r.liv===liv);
 if(!A.length&&!Bq.length)s+='<text x="'+(W/2)+'" y="'+(T+ih/2)+'" font-size="15" text-anchor="middle" fill="#777">Nessuna gara in questa vista</text>';
 CAT.forEach(c=>{const pts=A.filter(r=>r.cat===c);
  if(pts.length>1)s+='<polyline fill="none" stroke="'+COL[c]+'" stroke-width="3" stroke-linejoin="round" points="'+pts.map(r=>Xp(r.data)+','+Y(r.top)).join(' ')+'"/>';});
 if(S.showB)Bq.forEach(r=>{const x=Xp(r.data),y=Y(r.top);
  s+='<path d="M'+x+' '+(y-8)+' L'+(x+8)+' '+y+' L'+x+' '+(y+8)+' L'+(x-8)+' '+y+'Z" fill="#fff" stroke="'+COL[r.cat]+'" stroke-width="3"/>';});
 A.forEach(r=>{const x=Xp(r.data),y=Y(r.top);
  s+='<circle cx="'+x+'" cy="'+y+'" r="8" fill="'+COL[r.cat]+'" stroke="#fff" stroke-width="1.5"/>';
  s+='<text x="'+x+'" y="'+(y-12)+'" font-size="11" font-weight="800" text-anchor="middle" fill="#111" stroke="#fff" stroke-width="3" paint-order="stroke">'+r.pos+'°</text>';});
 /* incontri con te: etichetta V / S sotto il punto di lui */
 A.forEach(r=>{const hb=h2hOf(r.ev);if(!hb.length)return;
  const w=hb.filter(b=>b.w).length,l=hb.length-w;
  const txt=(w?(w>1?w:'')+'V':'')+(w&&l?' ':'')+(l?(l>1?l:'')+'S':'');
  const x=Xp(r.data),y=Y(r.top),bw=txt.length*9+12,py=(y+30>T+ih+6)?y-40:y+12;
  const bx=Math.max(2,Math.min(W-bw-2,x-bw/2));
  s+='<rect x="'+bx+'" y="'+py+'" width="'+bw+'" height="17" rx="8.5" fill="'+(!l?'#15803d':!w?'#c62828':'#444')+'" stroke="#fff" stroke-width="1.5"/>';
  s+='<text x="'+(bx+bw/2)+'" y="'+(py+12.5)+'" font-size="12" font-weight="800" text-anchor="middle" fill="#fff">'+txt+'</text>';});
 const sel=S.sel[liv];
 const hit=(arr,who)=>arr.forEach(r=>{const x=Xp(r.data),y=Y(r.top);
  const on=sel&&sel.who===who&&sel.i===r.i;
  if(on)s+='<circle cx="'+x+'" cy="'+y+'" r="14" fill="none" stroke="#111" stroke-width="3"/>';
  s+='<circle cx="'+x+'" cy="'+y+'" r="17" fill="transparent" style="cursor:pointer" onclick="pick(\''+liv+'\',\''+who+'\','+r.i+')"/>';});
 if(S.showB)hit(Bq,'b');hit(A,'a');
 return s+'</svg>';
}
function detail(liv){
 const sel=S.sel[liv],el=$('det_'+liv);
 if(!sel){el.innerHTML='<div class="mut">Nessuna gara '+(liv==='reg'?'regionale':'nazionale')+' nei dati.</div>';return}
 const r=(sel.who==='a'?X.op.ra:X.me.ra)[sel.i], oth0=sel.who==='a'?X.me.ra:X.op.ra;
 const o=oth0.find(z=>z.ev===r.ev);
 const who=sel.who==='a'?'Lui':'Tu', oth=sel.who==='a'?'Tu':'Lui';
 const hb=h2hOf(r.ev);
 el.innerHTML='<div class="row"><div><div class="kick">'+who.toUpperCase()+' · '+CATN[r.cat].toUpperCase()+'</div><div class="sm">'+esc(r.label)+' · '+fd(r.data)+'</div></div><span class="catbar" style="background:'+COL[r.cat]+';height:34px;width:8px"></span></div>'+
 '<div class="row" style="margin-top:6px"><div class="big">'+r.pos+'°<span class="mut mid" style="font-weight:500"> /'+r.n+'</span></div><div class="mid" style="text-align:right">Top '+r.top+'%</div></div>'+
 '<div class="sm mut" style="margin-top:6px">'+[r.seed?'Dopo i gironi: '+r.seed+'°':'',r.liv==='reg'?(r.rank?'Ranking FIS: '+r.rank:'Senza ranking FIS'):''].filter(Boolean).join(' · ')+'</div>'+
 (o?'<div class="sm" style="margin-top:6px"><b>'+oth+' nella stessa gara: '+o.pos+'°/'+o.n+'</b> (Top '+o.top+'%)</div>':'')+
 (PROV.has(r.ev)?'<div class="xs mut" style="margin-top:6px">Classifica provvisoria, ricostruita dalle dirette.</div>':'')+(hb.length?'<div class="sm" style="margin-top:8px;padding-top:8px;border-top:1px solid var(--line)"><b>Lui contro di te in questa gara:</b> '+hb.map(b=>'<span class="'+(b.w?'win':'loss')+'"><b>'+(b.w?'ha vinto lui':'hai vinto tu')+scTxt(b)+'</b></span> <span class="mut xs">('+(b.tipo==='gir'?'girone':'diretta '+turnoL(b.turno))+')</span>').join(' · ')+'</div>':'');
}
function h2hCard(liv){
 const hb=X.h2h.filter(b=>b.liv===liv).sort((x,y)=>y.data.localeCompare(x.data));
 const nm=liv==='reg'?'regionali':'nazionali';
 if(!hb.length)return '<div class="card sm"><b>Contro di te:</b> nessun incontro nei dati '+nm+'.</div>';
 const o=wl(hb);
 return '<div class="card"><div class="row"><div><div class="kick">LUI CONTRO DI TE · '+nm.toUpperCase()+'</div><div class="mid" style="margin-top:4px">'+fmt(o)+'</div></div><div>'+tag(sol(hb.length,3),hb.length+(hb.length===1?' assalto':' assalti'))+'</div></div>'+
 hb.map(b=>'<div class="row sm" style="padding:8px 0;border-top:1px solid var(--line);margin-top:8px"><div>'+fd(b.data)+' · '+CATN[b.cat]+'<br><span class="xs mut">'+(b.tipo==='gir'?'Girone · 5 stoccate':'Diretta '+turnoL(b.turno)+' · 15 stoccate')+'</span></div><div style="text-align:right"><span class="tag '+(b.w?'badge-w':'badge-l')+'">'+(b.w?'HA VINTO LUI':'HAI VINTO TU')+'</span><div style="margin-top:3px;font-weight:800">'+(scTxt(b).trim()||'–')+'</div></div></div>').join('')+
 '<div class="xs mut" style="margin-top:6px">V–S = vittorie e sconfitte di lui contro di te.</div></div>';
}
function pick(liv,who,i){S.sel[liv]={who,i};redrawL(liv)}
function redrawL(liv){$('chart_'+liv).innerHTML=chartSVG(liv);detail(liv)}
function redraw(){redrawL('reg');redrawL('naz');$('bB').classList.toggle('on',!!S.showB)}
function p1(){
 const ra=X.op.ra;
 S.sel={reg:null,naz:null};
 ['reg','naz'].forEach(l=>{const a=ra.map((r,i)=>({...r,i})).filter(r=>r.liv===l).slice(-1)[0];S.sel[l]=a?{who:'a',i:a.i}:null});
 const hasU=[...X.op.ra,...X.me.ra].some(r=>r.cat==='UNDER23');
 const lg=(c)=>'<span><span class="dot" style="background:'+COL[c]+'"></span><b>'+CATN[c]+'</b></span>';
 const sec=l=>'<h2>'+LIVN[l]+'</h2><div id="chart_'+l+'"></div><div class="card" id="det_'+l+'" style="margin-top:6px"></div>'+h2hCard(l);
 $('p1').innerHTML=backBtn+'<div class="kick">ANDAMENTO · POSIZIONE IN CLASSIFICA</div><h1 style="font-size:28px">'+esc(tc(X.op.cog))+'</h1>'+
 '<div class="legend">'+lg('CADETTI')+lg('GIOVANI')+lg('ASSOLUTI')+(hasU?lg('UNDER23'):'')+'</div>'+
 '<div class="legend" style="margin-top:0"><span><span class="dot" style="background:#555"></span>lui</span><span>◇ tu</span><span><span class="tag badge-w">V</span> <span class="tag badge-l">S</span> contro di te</span></div>'+
 '<button id="bB" class="btn on" onclick="S.showB=S.showB?0:1;redraw()" style="margin:6px 0 0">◇ Mostra anche te</button>'+
 sec('reg')+sec('naz')+
 '<div class="card sm"><b>Didascalia.</b> Un grafico per le regionali e uno per le nazionali, tenuti separati. Più in alto = meglio piazzato (1° in cima, “ult.” in fondo; la percentuale è la posizione sul totale degli iscritti). <b>Pallino pieno = lui</b> (con la posizione finale). <b>◇ Rombo vuoto = tu.</b> Il colore indica la categoria: <b style="color:var(--cad)">Cadetti</b> · <b style="color:var(--gio)">Giovani</b> · <b style="color:var(--ass)">Assoluti</b>'+(hasU?' · <b style="color:var(--u23)">Under 23</b> (grigio)':'')+'. Le linee uniscono le gare di lui nella stessa categoria: se passa da un colore a un altro, ha cambiato categoria. <b>Etichetta sotto il pallino:</b> in quella gara vi siete incontrati; <span class="win"><b>V</b></span> = ha vinto lui, <span class="loss"><b>S</b></span> = hai vinto tu (“V S” = uno a testa). Tocca un punto per i dettagli.</div>';
 redraw();
}

/* ---------- PAGINA 2: FORTI / DEBOLI ---------- */
function bars(o){const t=o.w+o.l;if(!t)return '<span class="mut">—</span>';
 return '<div class="cellv"><span class="win">'+o.w+'V</span>–<span class="loss">'+o.l+'S</span></div><div class="bar"><i class="w" style="width:'+(100*o.w/t)+'%"></i><i class="s" style="width:'+(100*o.l/t)+'%"></i></div>'}
function boutRow(b){
 return '<div class="bout"><div><div class="xs mut">'+fd(b.data)+' · '+CATN[b.cat]+' · '+esc(b.label)+(b.tipo==='dir'?' · '+turnoL(b.turno):'')+'</div>'+
 '<div class="nm">'+esc(tc(b.opp))+'</div><div class="xs mut">'+esc(b.soc||'')+(b.seed_opp&&b.seed_me?' · #'+b.seed_opp+' dopo gironi (lui #'+b.seed_me+')':'')+'</div></div>'+
 '<div style="text-align:right"><div class="sc">'+(b.a==null?'–':b.a)+'–'+(b.b==null?'–':b.b)+'</div><div style="margin-top:4px"><span class="tag '+(b.w?'badge-w':'badge-l')+'">'+(b.w?'VINTO':'PERSO')+'</span></div></div>'+
 '<div>'+(b.lv?'<span class="chip l-'+b.lv+'">'+LVN[b.lv]+'</span>':'')+'</div><div></div></div>';
}
function lvBlock(L){
 const all=X.op.bouts.filter(b=>b.liv===L);
 const dirs=all.filter(b=>b.tipo==='dir').sort((a,b)=>b.data.localeCompare(a.data)||a.turno-b.turno);
 const girs=all.filter(b=>b.tipo==='gir').sort((a,b)=>b.data.localeCompare(a.data));
 let g='<div class="grid3"><div></div><div class="hd">Gironi<br><span style="font-weight:500;text-transform:none">5 stoccate</span></div><div class="hd">Dirette<br><span style="font-weight:500;text-transform:none">15 stoccate</span></div>';
 ['forte','pari','debole'].forEach(lv=>{
  g+='<div><span class="chip l-'+lv+'">'+LVN[lv]+'</span></div><div>'+bars(wl(girs.filter(b=>b.lv===lv)))+'</div><div>'+bars(wl(dirs.filter(b=>b.lv===lv)))+'</div>';});
 g+='<div class="hd" style="padding-top:6px">Totale</div><div>'+bars(wl(girs))+'</div><div>'+bars(wl(dirs))+'</div></div>';
 const nG=girs.length,nD=dirs.length;
 const f=(arr,lv)=>wl(arr.filter(b=>b.lv===lv)), cnt=o=>o.w+o.l;
 const li=[];
 if(nG){const gf=f(girs,'forte'),gp=f(girs,'pari'),gd=f(girs,'debole');
  li.push('<li>'+tag(sol(nG,15),nG+' assalti')+'<p><b>Gironi:</b> con i forti '+fmt(gf)+', pari '+fmt(gp)+', deboli '+fmt(gd)+'.</p></li>');}
 if(nD){const df=f(dirs,'forte'),dp=f(dirs,'pari'),dd=f(dirs,'debole');
  li.push('<li>'+tag(sol(nD,12),nD+' assalti')+'<p><b>Dirette:</b> con i forti '+fmt(df)+', pari '+fmt(dp)+', deboli '+fmt(dd)+(cnt(dd)&&cnt(dd)<6?' (solo '+cnt(dd)+' con i deboli: indizio).':'.')+'</p></li>');}
 if(!li.length)li.push('<li><p class="mut">Nessun assalto '+(L==='reg'?'regionale':'nazionale')+' nei dati.</p></li>');
 const nota=L==='naz'?'<div class="card sm"><b>Nazionali.</b> I gironi assalto per assalto esistono solo per la stagione 2024/25, Under 23 2026 e Italiani Giovani 2026. Le dirette dal turno dei 32 hanno nomi troncati e circa il 10% dei punteggi manca.</div>':'';
 return '<h2>'+LIVN[L]+'</h2><div class="card">'+g+'</div>'+nota+
 '<div class="card" style="padding:4px 14px"><ul class="bul">'+li.join('')+'</ul></div>'+
 '<details><summary>Tutti gli assalti '+(L==='reg'?'regionali':'nazionali')+' ('+nD+' dirette · '+nG+' gironi)</summary>'+
 '<h2>Dirette ('+nD+')</h2><div>'+(dirs.map(boutRow).join('')||'<div class="mut sm">Nessuna diretta.</div>')+'</div>'+
 '<h2>Gironi ('+nG+')</h2><div>'+(girs.map(boutRow).join('')||'<div class="mut sm">Nessun girone.</div>')+'</div></details>';
}
function p2(){
 $('p2').innerHTML=backBtn+'<div class="kick">RISULTATI DI LUI PER LIVELLO AVVERSARIO</div><h1 style="font-size:28px">Forti / Deboli</h1>'+
 '<div class="card sm" style="margin-top:8px"><b>Come si legge.</b> <span class="win"><b>V</b></span>–<span class="loss"><b>S</b></span> = vittorie e sconfitte di lui. <span class="chip l-forte">FORTE</span> in classifica dopo i gironi sopra di lui di oltre il 10% degli iscritti · <span class="chip l-pari">PARI</span> entro il 10% · <span class="chip l-debole">DEBOLE</span> sotto di lui di oltre il 10%. Livello calcolato gara per gara sul seeding.</div>'+
 lvBlock('reg')+lvBlock('naz')+
 '<div class="xs mut" style="margin-top:10px">I gironi a 5 stoccate mostrano i risultati, non il modo di tirare.</div>';
}

/* ---------- PAGINA 3: CON TE ---------- */
function p3(){
 const{op,me,h2h}=X, ref=tc(me.cog.split(' ').slice(-1)[0]);
 const hw=h2h.filter(b=>b.w).length, hl=h2h.length-hw;
 const cards=h2h.map(b=>{
  const you=b.b,him=b.a,won=!b.w;
  const kind=b.tipo==='gir'?'Girone · 5 stoccate':'Diretta '+turnoL(b.turno)+' · 15 stoccate';
  const lvTxt=b.lv?(b.lv==='forte'?'tu eri “forte” per lui':b.lv==='debole'?'tu eri “debole” per lui':'livello pari'):'livello non calcolabile';
  return '<div class="card"><div class="row"><div class="sm"><b>'+fd(b.data)+'</b> · '+CATN[b.cat]+'<br><span class="mut xs">'+kind+' · '+esc(b.label)+'</span></div>'+
  '<span class="tag '+(won?'badge-w':'badge-l')+'" style="font-size:14px;padding:5px 11px">'+(won?'HAI VINTO TU':'HA VINTO LUI')+'</span></div>'+
  '<div class="row" style="margin-top:10px;justify-content:center;gap:18px"><div style="text-align:center"><div class="xs mut">TU</div><div class="big '+(won?'win':'')+'">'+(you==null?'–':you)+'</div></div><div class="mid mut">–</div><div style="text-align:center"><div class="xs mut">LUI</div><div class="big '+(won?'':'loss')+'">'+(him==null?'–':him)+'</div></div></div>'+
  '<div class="xs mut" style="margin-top:10px;text-align:center">'+(b.seed_opp&&b.seed_me?'Dopo i gironi di quella gara: tu '+b.seed_opp+'° · lui '+b.seed_me+'° · ':'')+lvTxt+'</div></div>';}).join('');

 const common=op.ra.map(r=>({a:r,b:me.ra.find(z=>z.ev===r.ev)})).filter(x=>x.b).sort((x,y)=>y.a.data.localeCompare(x.a.data));
 const lead=common.filter(x=>x.a.pos<x.b.pos).length, you=common.filter(x=>x.a.pos>x.b.pos).length;
 const show=common.slice(0,8);
 const trows=show.map(x=>{const aw=x.a.pos<x.b.pos,bw=x.a.pos>x.b.pos;
  return '<tr><td><span class="catbar" style="background:'+COL[x.a.cat]+'"></span>'+CATN[x.a.cat]+'<div class="xs mut">'+fd(x.a.data)+' · '+esc(x.a.label)+'</div></td><td style="'+(aw?'font-weight:800':'')+'">'+x.a.pos+'°<span class="xs mut">/'+x.a.n+'</span></td><td style="'+(bw?'font-weight:800':'')+'">'+x.b.pos+'°</td></tr>';}).join('');
 const oth=op.bouts.filter(b=>b.soc==='TOIVR'&&b.oppId!==me.id);
 const ow=wl(oth);
 const who=Object.keys(oth.reduce((o,b)=>(o[b.oppId]=1,o),{})).length;
 $('p3').innerHTML=backBtn+'<div class="kick">LUI CONTRO DI TE</div><h1 style="font-size:28px">Con '+esc(ref)+'</h1>'+
 '<div class="card"><div class="kick">PRECEDENTI</div><div class="big" style="margin:4px 0">'+hw+' – '+hl+'</div><div class="sm">lui – tu · '+tag(sol(h2h.length,6),h2h.length+(h2h.length===1?' assalto':' assalti'))+'</div>'+
 (h2h.length?'<p class="sm" style="margin:8px 0 0">'+(g=>g+(g===1?' girone':' gironi')+' (5 stoccate) · ')(h2h.filter(b=>b.tipo==='gir').length)+(d=>d+(d===1?' diretta':' dirette')+' (15). ')(h2h.filter(b=>b.tipo==='dir').length)+(h2h.some(b=>b.tipo==='dir')?'':'Nessuna diretta tra voi.')+'</p>':'<p class="sm" style="margin:8px 0 0">Nessun incontro tra voi nei dati.</p>')+'</div>'+
 cards+
 '<h2>Chi è davanti nelle gare in comune</h2>'+(common.length?'<div class="card" style="padding:6px 12px"><table><tr><th>Gara</th><th>Lui</th><th>Tu</th></tr>'+trows+'</table>'+
 '<div class="sm" style="padding:8px 0 4px"><b>Lui davanti '+lead+' volte su '+common.length+'; tu '+you+'.</b> '+(common.length>show.length?'Mostrate le ultime '+show.length+'. ':'')+tag(sol(common.length,6),common.length+' gare')+'</div></div>':'<div class="card sm mut">Nessuna gara in cui siete presenti entrambi.</div>')+
 '<h2>Lui contro altri TOIVR</h2><div class="card">'+(oth.length?'<div class="mid">'+fmt(ow)+'</div><div class="sm mut" style="margin-top:4px">'+oth.slice(0,10).map(b=>esc(tc(b.opp))+' '+(b.a==null?'–':b.a)+'–'+(b.b==null?'–':b.b)+(b.w?' V':' S')).join(' · ')+(oth.length>10?' · …':'')+'</div><div style="margin-top:6px">'+tag(sol(oth.length,6),oth.length+' assalti · '+who+' atleti')+'</div>':'<div class="sm mut">Nessun assalto contro altri atleti TOIVR nei dati.</div>')+'</div>';
}

/* ======================= AVVIO ======================= */
setupHTML();loadSel();
</script>
</body>
</html>
